<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- LCP Preload para Hero Image (Responsivo) -->
    <link rel="preload" as="image" href="/hero-mobile.webp" type="image/webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/hero-desktop.webp" type="image/webp" fetchpriority="high" media="(min-width: 900px)" />

    <!-- SEO y Meta Tags Base (serán sobreescritos por React Helmet) -->
    <title>Proyecto Cairo — Adopta, no compres</title>
    <meta name="description" content="Refugio benéfico dedicado a rescatar y dar en adopción a perros y gatos." />
    <meta name="theme-color" content="#102A43" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.webp" type="image/webp" />

    <!-- Tipografía Inter (Google Fonts) asíncrona -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" as="style" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
  </head>
  <body>
    <div id="root">
      <style>
        body, html {
          margin: 0;
          padding: 0;
          background-color: #102A43;
        }
        .initial-loader-container {
          display: flex;
          align-items: center;
          justify-content: center;
          height: 100vh;
          width: 100vw;
          background-color: #102A43;
        }
        .initial-loader-spinner {
          width: 50px;
          height: 50px;
          border: 4px solid rgba(255, 255, 255, 0.2);
          border-left-color: #FFFFFF;
          border-radius: 50%;
          animation: initial-loader-spin 1s linear infinite;
        }
        @keyframes initial-loader-spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
      </style>
      <div class="initial-loader-container">
        <div class="initial-loader-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
